
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Iniciar sesión</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,
                #e8efff, #f5f7fb, #e9edf5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            background: #e8efff;
            color: #315bea;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: #315bea;
            box-shadow: 0 0 0 .2rem rgba(49,91,234,.12);
        }

        .btn-login {
            background: #315bea;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
            border: none;
        }

        .btn-login:hover {
            background: #2449cc;
            color: white;
        }

        a {
            color: #315bea;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container px-3">

    <div class="card login-card mx-auto">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <div class="login-icon">
                    <i class="bi bi-lock"></i>
                </div>

                <h3 class="fw-bold">Bienvenido a la Biblioteca digital</h3>

                <p class="text-secondary">
                    Introduce tus credenciales para acceder
                </p>

            </div>

            <form id="loginForm">

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Correo electrónico
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           placeholder="nombre@correo.com"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Contraseña
                    </label>

                    <div class="input-group">
                        <input type="password"
                               class="form-control"
                               id="password"
                               placeholder="Introduce tu contraseña"
                               required>

                        <button class="btn btn-outline-secondary"
                                type="button"
                                id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember / Recover -->
                <div class="d-flex justify-content-between
                            align-items-center mb-4">

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="remember">

                        <label class="form-check-label"
                               for="remember">
                            Recordarme
                        </label>
                    </div>

                    <a href="recuperar-password.html"
                       class="small">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <!-- Button -->
                <button type="submit"
                        class="btn btn-login w-100">
                    Iniciar sesión
                </button>

                <div id="errorMessage"
                     class="alert alert-danger mt-3 d-none">
                </div>

            </form>

        </div>

        <div class="card-footer bg-white border-0
                    text-center pb-4">

            <small class="text-secondary">
                © 2026 · Todos los derechos reservados
            </small>

        </div>
    </div>

</div>

<script>

// Mostrar / ocultar contraseña
document.getElementById("togglePassword")
    .addEventListener("click", function () {

        const password =
            document.getElementById("password");

        const icon = this.querySelector("i");

        if (password.type === "password") {
            password.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
            password.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");
        }
    });

// Validación del formulario
document.getElementById("loginForm")
    .addEventListener("submit", function (e) {

        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const error = document.getElementById("errorMessage");

        error.classList.add("d-none");

        if (!email || !password) {
            error.textContent =
                "Debes introducir usuario y contraseña.";

            error.classList.remove("d-none");
            return;
        }

        // Aquí se conectará con el backend
        // para comprobar las credenciales.

        error.textContent =
            "Formulario validado. Pendiente de autenticación.";

        error.classList.remove("d-none");
    });

</script>

</body>
</html>
